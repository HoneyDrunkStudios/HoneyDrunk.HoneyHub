name: Nightly Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  dependency-report:
    name: dependency-report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check npm outdated
        run: npm outdated --workspaces --json > npm-outdated.json || true

      - name: Record Cargo dependency reports
        run: |
          cargo metadata --format-version 1 > cargo-metadata.json
          cargo tree --workspace > cargo-tree.txt

      - name: Upload dependency reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-reports
          path: |
            npm-outdated.json
            cargo-metadata.json
            cargo-tree.txt
          retention-days: 30
