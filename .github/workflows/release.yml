name: release

# Builds + signs the HoneyHub desktop app for each OS and publishes a GitHub Release with the
# Tauri auto-updater manifest (latest.json). Push a tag like `honeyhub-desktop-v0.23.0` to run.
#
# ── One-time operator setup (required before updates actually flow) ───────────────────────────
# 1. Generate a signing keypair:  `npx @tauri-apps/cli signer generate -w honeyhub.key`
#    (or `cargo tauri signer generate`). Keep `honeyhub.key` (private) SECRET; never commit it.
# 2. Add repo secrets:
#      TAURI_SIGNING_PRIVATE_KEY           = contents of honeyhub.key
#      TAURI_SIGNING_PRIVATE_KEY_PASSWORD  = the password you chose (empty string if none)
# 3. Put the PUBLIC key into crates/desktop/tauri.conf.json → plugins.updater.pubkey
#    (replace the REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY placeholder), commit it.
# 4. Tag a release: `git tag honeyhub-desktop-v<version> && git push --tags`. This workflow
#    creates a DRAFT release; review it, then publish — `releases/latest` (the updater endpoint)
#    only resolves to a published, non-prerelease release.
# Until steps 1–3 are done, the app's launch-time update check simply finds nothing (best-effort).

on:
  push:
    tags:
      - "honeyhub-desktop-v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust (stable, + mac universal target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
        shell: bash

      - name: Install Tauri (Linux) system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libxdo-dev libssl-dev

      - name: Install npm dependencies
        run: npm ci

      # Build the frontend (shared-types dist + the PWA into packages/ui/dist) — tauri.conf.json
      # has no beforeBuildCommand, so we build it explicitly before the Tauri bundle.
      - name: Build Node workspace
        run: npm run build

      # tauri-action builds + signs the per-OS bundles and creates/updates the draft release,
      # generating + uploading latest.json (the updater manifest) across the matrix. Pinned to an
      # immutable commit SHA (the signing key + contents:write make this a supply-chain-sensitive
      # step); bump the SHA deliberately when upgrading.
      - name: Build + publish desktop app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "HoneyHub ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
