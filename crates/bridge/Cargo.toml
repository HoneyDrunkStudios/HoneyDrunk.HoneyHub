[package]
name = "honeyhub-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test-only: gates the fake CLI fixtures (and the integration tests that drive them)
# so they are NOT built as product binary targets in a normal/release build
# (Grid invariant 16 — test code must not ship in a runtime package). Enable with
# `--features test-fixtures` to build the fixtures + run the live-process integration
# tests; CI passes it for the test/clippy steps but not the product `build`.
test-fixtures = []

# The fake CLI fixtures are live-duplex stand-ins used only by the integration tests
# (via `CARGO_BIN_EXE_*`). `required-features` keeps them out of the default binary
# surface so they cannot ship as product binaries.
[[bin]]
name = "fake_claude"
path = "src/bin/fake_claude.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "fake_codex"
path = "src/bin/fake_codex.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "fake_copilot"
path = "src/bin/fake_copilot.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "fake_usage_tui"
path = "src/bin/fake_usage_tui.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "fake_lsp"
path = "src/bin/fake_lsp.rs"
required-features = ["test-fixtures"]

[dependencies]
serde = { version = "1.0.185", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
# Drives the vendor CLIs' interactive TUIs (ConPTY on Windows / openpty on Unix) for
# the one-shot usage probes (/usage, /status) — those panels only render under a PTY.
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
