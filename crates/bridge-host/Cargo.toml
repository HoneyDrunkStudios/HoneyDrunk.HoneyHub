[package]
name = "honeyhub-bridge-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "honeyhub_bridge_host"
path = "src/lib.rs"

[[bin]]
name = "honeyhub-bridge-host"
path = "src/main.rs"

[dependencies]
honeyhub-bridge = { path = "../bridge" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "signal",
] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
notify = "6"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.10", features = ["v4"] }
# Byte-safe framing for launch output (ADR-0104): raw process bytes ride the JSON wire as
# base64 (the host encodes each chunk). Already resolved in the workspace lock.
# Byte-safe framing for the integrated terminal (ADR-0103): raw PTY bytes ride the JSON
# wire as base64 (the host encodes output, decodes input). Already resolved in the lock.
base64 = "0.22"
# Cross-backend subagents (ADR-0098): the bridge hosts a localhost streamable-HTTP
# MCP server exposing `dispatch_agent`. rmcp is the official Rust MCP SDK; its
# streamable-http-server transport nests directly into the same axum 0.8 router that
# serves the WS wire, so the endpoint mounts alongside the cockpit on one origin.
rmcp = { version = "2.1.0", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
schemars = "1"

[dev-dependencies]
tokio-tungstenite = "0.24"
# Temp workspaces for host-boundary tests (e.g. debug-config resolution over a fixture .csproj).
tempfile = "3"
