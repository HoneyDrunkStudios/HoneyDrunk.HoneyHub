# SonarQube Cloud project configuration for HoneyDrunk.HoneyHub.
#
# HoneyHub is the only Rust + TypeScript repo on the Grid; the other repos are .NET
# and get their analysis from the shared `job-sonarcloud.yml` reusable workflow (which
# runs `dotnet-sonarscanner`). That scanner is .NET-only, so HoneyHub runs the generic
# SonarScanner CLI (via `SonarSource/sonarqube-scan-action`) and reads this file.
#
# The org-level "SonarCloud Quality Gate" branch ruleset requires the `SonarCloud Code
# Analysis` check on main; this wiring is what produces it for HoneyHub.

sonar.organization=honeydrunkstudios
sonar.projectKey=honeydrunkstudios_HoneyDrunk.HoneyHub

# Analyze the Rust crates and the TS/React packages. Build output, dependencies, and the
# consumer workflow YAML (reviewed in HoneyDrunk.Actions) are out of scope.
sonar.sources=crates,packages
# Keep the source and test file sets disjoint: the *.test.* files under packages are
# the test scope (below), so exclude them from the main sources here.
sonar.exclusions=**/dist/**,**/node_modules/**,**/target/**,.github/workflows/**,**/*.test.ts,**/*.test.tsx,**/*.test.js

# Test code, so it is classified as tests (not main sources) for the JS/TS analyzer.
# Rust unit tests are inline `#[cfg(test)]` modules, so they cannot be split out by path.
sonar.tests=packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js

# Coverage reports (generated in CI before the scan runs).
#  - TS: vitest v8 coverage for the UI package (lcov).
#  - Rust: cargo-llvm-cov for the workspace (lcov).
sonar.javascript.lcov.reportPaths=packages/ui/coverage/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust.lcov

# Coverage scope (NOT analysis scope — these files are still scanned for issues/hotspots;
# they just don't count toward the coverage metric). Rust coverage is collected with
# `cargo llvm-cov --workspace --lib` (unit tests only) because the integration suite
# (tests/*.rs) spawns and KILLS child CLIs, and a killed instrumented child leaves a corrupt
# .profraw that fails `llvm-profdata merge`. So code exercised ONLY by the integration suite,
# or only by running the desktop app, has no measurable unit coverage and is excluded from the
# metric:
#  - crates/desktop/**             the Tauri shell (window/bind/serve glue + build script)
#  - crates/bridge-host/src/main.rs  host binary entrypoint (bind/serve/announce glue)
#  - crates/bridge-host/src/lib.rs   wire command dispatch — covered by tests/ws_roundtrip.rs
#  - crates/bridge/src/adapters/**   CLI adapters — covered by tests/{claude,codex,copilot}_local.rs
#  - crates/bridge/src/process.rs    low-level process spawn/kill — covered by the integration suite
#
# The opt-in connectors below shell live external dependencies; only their pure parse
# helpers are unit-testable (those keep their unit tests), while the connector ENTRYPOINTS
# are reachable only with the live dependency present (integration-only — same category as
# process.rs / adapters above), so they have no measurable unit coverage:
#  - crates/bridge/src/servicebus.rs  shells the optional honeyhub-sb-explorer sidecar against
#                                     a live Azure Service Bus namespace (peek/resubmit/purge/send/receive)
#  - crates/bridge/src/work.rs        shells the GitHub/Azure DevOps CLIs for work-item snapshots
#  - crates/bridge/src/environment.rs reads host OS/runtime/system info (non-deterministic to unit-test)
#  - packages/ui/src/wire/webSocketClient.ts  the live WebSocket transport — the TS analog of the
#                                     bridge-host transport excluded above (exercised end-to-end, not unit-tested)
sonar.coverage.exclusions=crates/desktop/**,crates/bridge-host/src/main.rs,crates/bridge-host/src/lib.rs,crates/bridge/src/adapters/**,crates/bridge/src/process.rs,crates/bridge/src/servicebus.rs,crates/bridge/src/work.rs,crates/bridge/src/environment.rs,packages/ui/src/wire/webSocketClient.ts
